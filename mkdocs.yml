site_name: Simulador d'Exàmens PRG 25/26 - Java DAM
site_description: Plataforma interactiva d'autoaprenentatge i simulacres d'examen de Java per a 1r de DAM
site_author: Mara Vañó
site_url: https://Mara1978-val.github.io/SimuladorExamenJava/

theme:
  name: material
  language: ca
  font:
    text: Roboto
    code: Fira Code
  palette:
    # Mode Clar
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Canviar a mode fosc
    # Mode Fosc
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Canviar a mode clar
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - toc.integrate
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - javascripts/java-interpreter.js
  - javascripts/dades/ra1.js
  - javascripts/dades/ra3.js
  - javascripts/dades/ra5.js
  - javascripts/dades/ra6.js
  - javascripts/dades/int-basic.js
  - javascripts/dades/int-mitja.js
  - javascripts/dades/int-avancada.js
  - javascripts/simulator.js
  - javascripts/valencia-theme.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - docs
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables

nav:
  - Home: index.md
  - Primera Aval:
      - Simulador d'Examen: 1eval/examen1e.md
      - Solucions Explicades: 1eval/solucions1e.md
      - Rúbrica de Correcció: 1eval/rubrica1e.md
  - Segona Aval: 2eval/index.md
